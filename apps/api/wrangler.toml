name = "website-maker-ai-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = true

[vars]
APP_NAME = "Nexora.Ai"
PUBLIC_API_BASE_URL = "https://website-maker-ai-api.poojakpdoshi.workers.dev"

QA_PROVIDER = "arcee"
# Set ARCEE_QA_MODEL to a verified model ID in the Worker environment.
ARCEE_QA_MODEL = "trinity-mini"

GROQ_CODER_MODEL = "openai/gpt-oss-120b"
GROQ_REVIEWER_MODEL = "qwen/qwen3-32b"
CLOUDFLARE_REPAIR_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *"]
